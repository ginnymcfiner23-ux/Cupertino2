name: Build and verify analytics dashboard

# Session b58dfdcf's dashboard under site/. This is a CI check only.
#
# GitHub Pages for this repository is on the legacy main-branch root source, so there is
# exactly one Pages deployment and it belongs to the root guide (see pages.yml). This
# workflow rebuilds the dashboard from source, re-runs both of its own gates, and uploads
# the result as an artifact for inspection. A build that fails its own verification is
# never uploaded as a passing artifact.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/**"
      - "data/model.json"
      - ".github/workflows/site-build.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/**"
      - "data/model.json"
      - ".github/workflows/site-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the committed site matches its source
        run: |
          python3 tools/model.py
          python3 tools/build_site.py
          python3 tools/pii_scan.py site/
          python3 tools/verify.py
          git diff --exit-code -- site/

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
